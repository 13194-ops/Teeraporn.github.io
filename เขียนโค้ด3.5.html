        <PRE>
            "เร็วก็หาว่าลํ็าหน้า
            พอช้าก็หาว่าอืดอาด
            โง่ก็ถูฏตะวาด
            พอฉลาดก็ถูกระแวง
             ทำก่อนบอกไม่ได้สั่ง
            ครั้นพอทำทีหลังบอกไม่รู้จักคิด
            คนดี ดี ถูฏถีบไปไกลตัว
            แต่กลับเอาคนชั่วมาไกล้ชิด"
        </PRE>
